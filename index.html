<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive - Trường học của chúng ta</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Material+Icons+Outlined&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #202124;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Header --- */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            height: 64px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 240px;
        }

        .header-left img {
            width: 40px;
            height: 40px;
        }

        .header-left span {
            font-size: 22px;
            color: #5f6368;
            font-weight: 400;
        }

        .header-search {
            flex: 1;
            max-width: 720px;
            display: flex;
            align-items: center;
            background-color: #f1f3f4;
            border-radius: 8px;
            padding: 0 12px;
            height: 46px;
        }

        .header-search input {
            width: 100%;
            border: none;
            background: transparent;
            padding: 12px;
            font-size: 16px;
            outline: none;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            color: #5f6368;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #1a73e8;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        /* --- Main Layout --- */
        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 64px);
        }

        /* Sidebar Left */
        sidebar {
            width: 256px;
            padding: 16px 8px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-new {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px 12px 16px;
            border: none;
            border-radius: 24px;
            background-color: #ffffff;
            color: #3c4043;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
            cursor: pointer;
            transition: box-shadow 0.2s;
            width: fit-content;
        }

        .btn-new:hover {
            background-color: #f1f3f4;
            box-shadow: 0 4px 8px 3px rgba(60,64,67,0.15), 0 1px 3px 0 rgba(60,64,67,0.3);
        }

        .menu-list {
            list-style: none;
            display: flex;
            flex-direction: column;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 24px;
            height: 40px;
            border-radius: 0 20px 20px 0;
            color: #3c4043;
            font-size: 14px;
            cursor: pointer;
        }

        .menu-item.active {
            background-color: #e8f0fe;
            color: #1a73e8;
            font-weight: 500;
        }

        .storage-info {
            margin-top: auto;
            padding: 16px;
            font-size: 13px;
            color: #5f6368;
        }

        /* Content Area Right */
        .content-area {
            flex: 1;
            background-color: #ffffff;
            margin-right: 16px;
            margin-bottom: 16px;
            border-radius: 16px;
            border: 1px solid #e0e0e0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .content-title {
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 20px;
            color: #202124;
        }

        /* Grid hiển thị File */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
        }

        .file-card {
            border: 1px solid #e0e0e0;
            background-color: #f8f9fa;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
            position: relative;
            transition: background-color 0.2s;
            text-decoration: none;
            color: inherit;
        }

        .file-card:hover {
            background-color: #edf2fa;
        }

        .file-icon-wrapper {
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #f1f3f4;
        }

        .file-icon-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: space-between;
        }

        .file-name {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .btn-delete {
            border: none;
            background: transparent;
            color: #cc0000;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        #file-upload-input {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <img src="https://upload.wikimedia.org/wikipedia/commons/d/da/Google_Drive_logo.png" alt="Drive Logo">
            <span>Drive</span>
        </div>
        <div class="header-search">
            <span class="material-icons-outlined" style="color: #5f6368;">search</span>
            <input type="text" placeholder="Tìm trong Drive" id="search-input" oninput="filterFiles()">
        </div>
        <div class="header-right">
            <span class="material-icons-outlined">help_outline</span>
            <span class="material-icons-outlined">settings</span>
            <span class="material-icons-outlined">apps</span>
            <div class="avatar">School</div>
        </div>
    </header>

    <div class="main-container">
        <sidebar>
            <button class="btn-new" onclick="triggerUpload()">
                <span class="material-icons-outlined">add</span>
                Tải tệp lên
            </button>
            <input type="file" id="file-upload-input" multiple onchange="handleFileUpload(this.files)">

            <ul class="menu-list">
                <li class="menu-item active">
                    <span class="material-icons-outlined">folder</span>
                    <span>Drive của trường</span>
                </li>
            </ul>

            <div class="storage-info">
                <span class="material-icons-outlined" style="vertical-align: middle; font-size: 18px;">cloud</span>
                <span style="margin-left: 8px;">Dung lượng: <b>Vô hạn (GB)</b></span>
            </div>
        </sidebar>

        <main class="content-area">
            <h2 class="content-title" id="title-status">Drive chung hệ thống</h2>
            <div class="file-grid" id="file-display-grid">
                </div>
        </main>
    </div>

    <script>
        let allFilesDatabase = [];

        // Khi load lại trang (F5), nạp lại toàn bộ file cũ lên màn hình không lo bị mất
        window.onload = function() {
            const savedData = localStorage.getItem('school_drive_cloud_db');
            if (savedData) {
                allFilesDatabase = JSON.parse(savedData);
                renderGrid(allFilesDatabase);
            }
        };

        function triggerUpload() {
            document.getElementById('file-upload-input').click();
        }

        // Xử lý upload thông minh, chống đứng trang, chống sập
        async function handleFileUpload(files) {
            const statusTitle = document.getElementById('title-status');

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                statusTitle.textContent = `⏳ Đang tải lên: ${file.name}...`;

                let fileUrl = "#";
                let filePreview = "";

                // NẾU LÀ FILE ẢNH: Tự động đẩy lên server đám mây Imgur ẩn lấy link gốc vĩnh viễn
                if (file.type.startsWith('image/')) {
                    try {
                        const formData = new FormData();
                        formData.append('image', file);

                        const res = await fetch('https://api.imgur.com/3/image', {
                            method: 'POST',
                            headers: { Authorization: 'Client-ID fc95b9a89725b81' }, // Kho lưu trữ ảnh cộng đồng miễn phí
                            body: formData
                        });
                        const data = await res.json();
                        if(data.success) {
                            fileUrl = data.data.link;
                            filePreview = data.data.link; // Link xem trực tiếp siêu nhanh
                        }
                    } catch (err) {
                        // Nếu mạng lỗi, dùng giải pháp backup nội bộ
                        filePreview = await fileToBase64(file);
                    }
                } else {
                    // NẾU LÀ FILE KHÁC (Tài liệu, zip, exe, v.v.): Mã hóa chuỗi nhị phân lưu trữ an toàn
                    filePreview = await fileToBase64(file);
                }

                // Cấu trúc dữ liệu lưu trữ đám mây
                const fileObject = {
                    id: Date.now() + Math.random(),
                    name: file.name,
                    type: file.type,
                    link: fileUrl,
                    preview: filePreview
                };

                allFilesDatabase.push(fileObject);
                localStorage.setItem('school_drive_cloud_db', JSON.stringify(allFilesDatabase));
                renderGrid(allFilesDatabase);
            }
            statusTitle.textContent = "Drive chung hệ thống";
        }

        // Vẽ tệp tin lên màn hình
        function renderGrid(filesArray) {
            const grid = document.getElementById('file-display-grid');
            grid.innerHTML = "";

            filesArray.forEach(file => {
                const card = document.createElement('div');
                card.className = 'file-card';
                
                const iconWrapper = document.createElement('div');
                iconWrapper.className = 'file-icon-wrapper';

                // Kiểm tra định dạng hiển thị ảnh xem trước giống Google Drive thật
                if (file.type && file.type.startsWith('image/') && file.preview) {
                    const img = document.createElement('img');
                    img.src = file.preview;
                    iconWrapper.appendChild(img);
                } else {
                    const icon = document.createElement('span');
                    icon.className = 'material-icons-outlined';
                    icon.style.fontSize = "48px";
                    
                    if(file.type && file.type.includes('pdf')) icon.textContent = 'picture_as_pdf';
                    else if(file.type && file.type.includes('zip') || file.name.includes('.zip') || file.name.includes('.rar')) icon.textContent = 'folder_zip';
                    else if(file.type && file.type.includes('video') || file.name.includes('.mp4')) icon.textContent = 'video_file';
                    else icon.textContent = 'insert_drive_file';
                    
                    icon.style.color = "#1a73e8";
                    iconWrapper.appendChild(icon);
                }

                const fileInfo = document.createElement('div');
                fileInfo.className = 'file-info';
                
                const fileName = document.createElement('span');
                fileName.className = 'file-name';
                fileName.textContent = file.name;
                fileName.title = "Bấm để tải về: " + file.name;

                // Nút xóa file nếu đăng nhầm
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn-delete';
                deleteBtn.innerHTML = '<span class="material-icons-outlined" style="font-size:18px;">delete</span>';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation(); // Không cho kích hoạt sự kiện click tải file
                    deleteFile(file.id);
                };

                fileInfo.appendChild(fileName);
                fileInfo.appendChild(deleteBtn);
                card.appendChild(iconWrapper);
                card.appendChild(fileInfo);
                
                // Bấm vào card để tải file/ảnh về máy
                card.onclick = () => {
                    const a = document.createElement('a');
                    a.href = file.preview;
                    a.download = file.name;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                };

                grid.appendChild(card);
            });
        }

        // Tính năng xóa file
        function deleteFile(id) {
            allFilesDatabase = allFilesDatabase.filter(f => f.id !== id);
            localStorage.setItem('school_drive_cloud_db', JSON.stringify(allFilesDatabase));
            renderGrid(allFilesDatabase);
        }

        // Tìm kiếm tệp nhanh
        function filterFiles() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = allFilesDatabase.filter(f => f.name.toLowerCase().includes(query));
            renderGrid(filtered);
        }

        // Hàm đọc file nhị phân
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
