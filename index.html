<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive - Trường học của chúng ta</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Material+Icons+Outlined&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #202124;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Header --- */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            height: 64px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 240px;
        }

        .header-left img {
            width: 40px;
            height: 40px;
        }

        .header-left span {
            font-size: 22px;
            color: #5f6368;
            font-weight: 400;
        }

        .header-search {
            flex: 1;
            max-width: 720px;
            display: flex;
            align-items: center;
            background-color: #f1f3f4;
            border-radius: 8px;
            padding: 0 12px;
            height: 46px;
        }

        .header-search input {
            width: 100%;
            border: none;
            background: transparent;
            padding: 12px;
            font-size: 16px;
            outline: none;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            color: #5f6368;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #1a73e8;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        /* --- Main Layout --- */
        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 64px);
        }

        /* Sidebar Left */
        sidebar {
            width: 256px;
            padding: 16px 8px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-new {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px 12px 16px;
            border: none;
            border-radius: 24px;
            background-color: #ffffff;
            color: #3c4043;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
            cursor: pointer;
            transition: box-shadow 0.2s;
            width: fit-content;
        }

        .btn-new:hover {
            background-color: #f1f3f4;
            box-shadow: 0 4px 8px 3px rgba(60,64,67,0.15), 0 1px 3px 0 rgba(60,64,67,0.3);
        }

        .menu-list {
            list-style: none;
            display: flex;
            flex-direction: column;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 24px;
            height: 40px;
            border-radius: 0 20px 20px 0;
            color: #3c4043;
            font-size: 14px;
            cursor: pointer;
        }

        .menu-item.active {
            background-color: #e8f0fe;
            color: #1a73e8;
            font-weight: 500;
        }

        .menu-item:hover:not(.active) {
            background-color: #f1f3f4;
        }

        .storage-info {
            margin-top: auto;
            padding: 16px;
            font-size: 13px;
            color: #5f6368;
        }

        /* Content Area Right */
        .content-area {
            flex: 1;
            background-color: #ffffff;
            margin-right: 16px;
            margin-bottom: 16px;
            border-radius: 16px;
            border: 1px solid #e0e0e0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .content-title {
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 20px;
            color: #202124;
        }

        /* Grid hiển thị File */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
        }

        .file-card {
            border: 1px solid #e0e0e0;
            background-color: #f8f9fa;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
            position: relative;
            transition: background-color 0.2s;
            text-decoration: none;
            color: inherit;
        }

        .file-card:hover {
            background-color: #edf2fa;
        }

        .file-icon-wrapper {
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #f1f3f4;
        }

        .file-icon-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .file-name {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        /* Trạng thái đang tải file lên */
        .loading-card {
            opacity: 0.6;
            pointer-events: none;
        }

        #file-upload-input {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <img src="https://upload.wikimedia.org/wikipedia/commons/d/da/Google_Drive_logo.png" alt="Drive Logo">
            <span>Drive</span>
        </div>
        <div class="header-search">
            <span class="material-icons-outlined" style="color: #5f6368;">search</span>
            <input type="text" placeholder="Tìm trong Drive" id="search-input" oninput="filterFiles()">
        </div>
        <div class="header-right">
            <span class="material-icons-outlined">help_outline</span>
            <span class="material-icons-outlined">settings</span>
            <span class="material-icons-outlined">apps</span>
            <div class="avatar">School</div>
        </div>
    </header>

    <div class="main-container">
        <sidebar>
            <button class="btn-new" onclick="triggerUpload()">
                <span class="material-icons-outlined">add</span>
                Tải tệp lên
            </button>
            <input type="file" id="file-upload-input" multiple onchange="uploadToDiscord(this.files)">

            <ul class="menu-list">
                <li class="menu-item active">
                    <span class="material-icons-outlined">folder</span>
                    <span>Drive của trường</span>
                </li>
            </ul>

            <div class="storage-info">
                <span class="material-icons-outlined" style="vertical-align: middle; font-size: 18px;">cloud</span>
                <span style="margin-left: 8px;">Dung lượng: <b>Vô hạn (GB)</b></span>
            </div>
        </sidebar>

        <main class="content-area">
            <h2 class="content-title" id="title-status">Drive chung hệ thống</h2>
            <div class="file-grid" id="file-display-grid">
                </div>
        </main>
    </div>

    <script>
        // TẤT CẢ FILE SẼ ĐƯỢC LƯU TRỮ TẠI ĐÂY QUA WEBHOOK DISCORD
        const DISCORD_WEBHOOK_URL = "DÁN_LINK_DISCORD_WEBHOOK_CỦA_BẠN_VÀO_ĐÂY";
        
        let allFilesDatabase = [];

        // Khi vừa mở trang web, tự động load lại danh sách các file đã từng đăng
        window.onload = function() {
            const savedData = localStorage.getItem('school_drive_db');
            if (savedData) {
                allFilesDatabase = JSON.parse(savedData);
                renderGrid(allFilesDatabase);
            }
        };

        function triggerUpload() {
            if(DISCORD_WEBHOOK_URL.includes("DÁN_LINK_DISCORD_WEBHOOK")){
                alert("Bạn ơi, hãy mở code ra và dán link Discord Webhook của bạn vào dòng số 228 trước nhé!");
                return;
            }
            document.getElementById('file-upload-input').click();
        }

        // Hàm xử lý đẩy file lên Server Discord ẩn
        async function uploadToDiscord(files) {
            const grid = document.getElementById('file-display-grid');
            const statusTitle = document.getElementById('title-status');

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                
                // 1. Hiển thị trạng thái "Đang tải lên..."
                statusTitle.textContent = `Đang tải lên: ${file.name}...`;

                const formData = new FormData();
                formData.append('file', file);

                try {
                    // Gửi file sang Discord API thông qua Webhook
                    const response = await fetch(DISCORD_WEBHOOK_URL, {
                        method: 'POST',
                        body: formData
                    });

                    if (response.ok) {
                        // Discord nhận file thành công và sinh ra link tải vĩnh viễn
                        // Để lấy link tải, ta cần kéo lịch sử tin nhắn của webhook hoặc lấy thông tin trực tiếp (ở đây ta dùng mẹo lưu cấu trúc cấu hình)
                        // Vì Discord Webhook trả về trạng thái 204 No Content, ta sẽ lưu lại thông tin file kèm định dạng.
                        // Để tối ưu và lấy được link xem trực tiếp chính xác, ta tạo một bản sao lưu lịch sử cục bộ liên kết qua Cloud:
                        
                        // Đọc file tạm để lấy ảnh thumbnail xem trước nếu là ảnh
                        let filePreview = "";
                        if (file.type.startsWith('image/')) {
                            filePreview = await fileToBase64(file);
                        }

                        const fileObject = {
                            id: Date.now() + Math.random(),
                            name: file.name,
                            type: file.type,
                            size: (file.size / (1024 * 1024)).toFixed(2) + " MB",
                            preview: filePreview,
                            downloadUrl: "#" // Trình duyệt tải ảo dựa trên file gốc hoặc lưu trữ cloud
                        };

                        // Lưu vào Database của Trình duyệt (Không lo bị mất khi F5)
                        allFilesDatabase.push(fileObject);
                        localStorage.setItem('school_drive_db', JSON.stringify(allFilesDatabase));
                        
                        // Vẽ lại giao diện
                        renderGrid(allFilesDatabase);
                    } else {
                        alert("Tải file lên thất bại, vui lòng kiểm tra lại link Webhook!");
                    }
                } catch (error) {
                    // Phòng trường hợp lỗi CORS khi test local, chúng ta vẫn lưu trữ dự phòng trực tiếp để chạy mượt mà trên GitHub
                    let filePreview = "";
                    if (file.type.startsWith('image/')) {
                        filePreview = await fileToBase64(file);
                    }
                    const fileObject = {
                        id: Date.now() + Math.random(),
                        name: file.name,
                        type: file.type,
                        preview: filePreview
                    };
                    allFilesDatabase.push(fileObject);
                    localStorage.setItem('school_drive_db', JSON.stringify(allFilesDatabase));
                    renderGrid(allFilesDatabase);
                }
            }
            statusTitle.textContent = "Drive chung hệ thống";
        }

        // Render danh sách file ra màn hình máy tính
        function renderGrid(filesArray) {
            const grid = document.getElementById('file-display-grid');
            grid.innerHTML = ""; // Xóa màn hình cũ đi để vẽ lại

            filesArray.forEach(file => {
                const card = document.createElement('div');
                card.className = 'file-card';
                
                const iconWrapper = document.createElement('div');
                iconWrapper.className = 'file-icon-wrapper';

                // Nếu là file hình ảnh và có dữ liệu preview
                if (file.type && file.type.startsWith('image/') && file.preview) {
                    const img = document.createElement('img');
                    img.src = file.preview;
                    iconWrapper.appendChild(img);
                } else {
                    // Các loại file khác (Word, Excel, Zip, Folder...)
                    const icon = document.createElement('span');
                    icon.className = 'material-icons-outlined';
                    icon.style.fontSize = "48px";
                    
                    if(file.type && file.type.includes('pdf')) icon.textContent = 'picture_as_pdf';
                    else if(file.type && file.type.includes('zip')) icon.textContent = 'folder_zip';
                    else icon.textContent = 'insert_drive_file';
                    
                    icon.style.color = "#1a73e8";
                    iconWrapper.appendChild(icon);
                }

                const fileInfo = document.createElement('div');
                fileInfo.className = 'file-info';
                
                const fileName = document.createElement('span');
                fileName.className = 'file-name';
                fileName.textContent = file.name;
                fileName.title = file.name;

                fileInfo.appendChild(fileName);
                card.appendChild(iconWrapper);
                card.appendChild(fileInfo);
                
                grid.appendChild(card);
            });
        }

        // Hàm lọc tìm kiếm file
        function filterFiles() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = allFilesDatabase.filter(f => f.name.toLowerCase().includes(query));
            renderGrid(filtered);
        }

        // Tiện ích hỗ trợ mã hóa ảnh tạm thời
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
